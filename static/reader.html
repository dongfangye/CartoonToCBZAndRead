<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComicPack · 阅读</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/reader.css">
</head>
<body>

<header class="topbar reader-bar">
  <div class="brand">
    <span class="logo">📖</span>
    <div class="brand-text">
      <h1>ComicPack <span class="tag">阅读</span></h1>
      <p>
        <span id="doc-name" title="">未打开文件</span>
        <span id="doc-count" class="doc-count hidden"></span>
      </p>
    </div>
  </div>

  <nav class="nav">
    <a class="ghost" href="/">打包</a>
    <a class="ghost" href="/reader" aria-current="page">阅读</a>
    <a class="ghost" href="/rename">改名</a>
    <a class="ghost" href="/organize">整理</a>
    <a class="ghost" href="/emby">剧集</a>
  </nav>

  <div class="tools">
    <button id="btn-shelf" class="btn btn-sm hidden" title="返回封面列表">‹ 书架</button>
    <button id="btn-open-dir" class="btn btn-primary btn-sm">打开漫画文件夹…</button>

    <span class="sep"></span>

    <div class="modes">
      <button id="btn-mode-single" class="btn btn-sm mode-btn active" title="单页">单页</button>
      <button id="btn-mode-double" class="btn btn-sm mode-btn" title="双页并排">双页</button>
      <button id="btn-mode-scroll" class="btn btn-sm mode-btn" title="竖屏连续滚动">竖屏</button>
    </div>

    <span class="sep"></span>

    <div class="pager">
      <button id="btn-prev" class="btn btn-sm" title="上一页（←）">‹</button>
      <input id="page-input" type="text" inputmode="numeric" value="1" aria-label="页码">
      <span class="pager-total">/ <b id="page-total">0</b></span>
      <button id="btn-next" class="btn btn-sm" title="下一页（→）">›</button>
    </div>

    <span class="sep"></span>

    <div class="zoom">
      <button id="btn-zoom-out" class="btn btn-sm" title="缩小（-）">−</button>
      <span id="zoom-label" class="zoom-label">100%</span>
      <button id="btn-zoom-in" class="btn btn-sm" title="放大（+）">+</button>
      <button id="btn-fit-page" class="btn btn-sm fit-btn active" title="整页显示">整页</button>
      <button id="btn-fit-w" class="btn btn-sm fit-btn" title="适应宽度">宽度</button>
      <button id="btn-actual" class="btn btn-sm fit-btn" title="原始尺寸（0）">1:1</button>
    </div>

    <span class="sep"></span>

    <button id="btn-chapters" class="btn btn-sm" title="章节目录">目录</button>
    <button id="btn-full" class="btn btn-sm" title="全屏（F）">全屏</button>
    <button id="btn-quit" class="ghost">关闭服务</button>
  </div>
</header>

<div class="reader-body">
<aside id="chapters" class="chapters hidden" aria-label="章节目录">
  <div class="chapters-head">
    <span class="chapters-title">目录</span>
    <span id="chapters-count" class="chapters-count">0</span>
    <button id="btn-chapters-hide" class="chapter-x" title="收起目录">×</button>
  </div>
  <ul id="chapter-list" class="chapter-list"></ul>
  <div class="chapters-foot">
    <button id="btn-prev-chapter" class="btn btn-sm">‹ 上一话</button>
    <button id="btn-next-chapter" class="btn btn-sm btn-primary">下一话 ›</button>
  </div>
</aside>

<main id="stage" class="stage">
  <div id="empty" class="reader-empty">
    <div class="empty-icon">📚</div>
    <h2>打开一个漫画文件夹</h2>
    <p>选中文件夹后会递归找出里面（含子文件夹）的所有 <b>.cbz</b> / <b>.zip</b>，
       以封面墙的形式列出来；点封面开始阅读，没封面就显示默认封面。</p>
    <div class="empty-actions">
      <button id="btn-empty-open" class="btn btn-primary">打开漫画文件夹…</button>
    </div>
    <p class="empty-hint">快捷键：← → 翻页 · + − 缩放 · n 下一话 · b 回书架 · F 全屏</p>
  </div>

  <div id="shelf" class="shelf hidden">
    <div class="shelf-head">
      <div class="shelf-title-wrap">
        <span class="shelf-icon">📚</span>
        <span id="shelf-title" class="shelf-title"></span>
        <span id="shelf-count" class="shelf-count"></span>
      </div>
    </div>
    <div id="shelf-grid" class="shelf-grid"></div>
    <div class="shelf-pager">
      <button id="btn-page-prev" class="btn btn-sm">‹ 上一页</button>
      <span id="shelf-page-info" class="shelf-page-info">第 1 / 1 页</span>
      <button id="btn-page-next" class="btn btn-sm">下一页 ›</button>
    </div>
  </div>

  <div id="canvas" class="canvas hidden">
    <div id="spread" class="spread">
      <img id="img-a" class="page-img" alt="页面" draggable="false">
      <img id="img-b" class="page-img hidden" alt="右页" draggable="false">
    </div>
    <div id="page-error" class="page-error hidden"></div>
  </div>

  <div id="scroll" class="scroll hidden"></div>

  <div id="spinner" class="spinner hidden"><span></span></div>
</main>
</div>

<footer class="reader-foot">
  <input id="slider" type="range" min="1" max="1" value="1" aria-label="跳转页码">
  <label id="cover-solo-wrap" class="mini-check hidden">
    <input id="cover-solo" type="checkbox" checked> 封面单独
  </label>
  <div class="foot-info">
    <span id="page-meta">未打开文件</span>
    <span class="hint">← → 翻页 · + − 缩放 · n 下一话 · b 书架 · F 全屏</span>
  </div>
</footer>

<div id="picker" class="picker hidden" role="dialog" aria-modal="true" aria-label="选择文件夹">
  <div class="picker-box">
    <div class="picker-head">
      <span id="picker-title">打开漫画文件夹</span>
      <button id="picker-close" class="chapter-x" title="关闭（Esc）">×</button>
    </div>
    <div class="picker-path">
      <input id="picker-input" type="text" spellcheck="false" placeholder="粘贴路径，例如 D:\漫画">
      <button id="picker-go" class="btn btn-sm">前往</button>
    </div>
    <div id="picker-roots" class="picker-roots"></div>
    <ul id="picker-list" class="picker-list"></ul>
    <div class="picker-foot">
      <button id="picker-up" class="btn btn-sm">上一级</button>
      <span id="picker-hint" class="picker-hint"></span>
      <button id="picker-select" class="btn btn-sm btn-primary">打开当前文件夹</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/reader.js"></script>
</body>
</html>
