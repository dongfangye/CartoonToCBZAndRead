<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComicPack · 视频改名</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🏷️</span>
    <div class="brand-text">
      <h1>ComicPack <span class="tag">改名</span></h1>
      <p>双击文件名直接改，确认后应用</p>
    </div>
  </div>
  <nav class="nav">
    <a class="ghost" href="/">打包</a>
    <a class="ghost" href="/reader">阅读</a>
    <a class="ghost" href="/rename" aria-current="page">改名</a>
    <a class="ghost" href="/organize">整理</a>
    <a class="ghost" href="/emby">剧集</a>
    <a class="ghost" href="/play">播放</a>
  </nav>
  <button id="btn-quit" class="ghost" title="停止本地服务">关闭服务</button>
</header>

<main class="layout">

  <!-- ================= 左：视频清单 ================= -->
  <section class="panel panel-left">
    <div class="panel-head">
      <h2>视频文件夹</h2>
      <span class="hint">只列这一层的视频，双击名字就能改</span>
    </div>

    <div class="path-row">
      <input id="path" type="text" spellcheck="false"
             placeholder="点「浏览…」选择，或直接粘贴路径（支持带引号）">
      <button id="btn-browse" class="btn btn-primary">浏览…</button>
      <button id="btn-scan" class="btn">扫描</button>
    </div>

    <div id="summary" class="summary">尚未选择文件夹</div>

    <div class="list-wrap">
      <table id="table" class="rename-table hidden">
        <thead>
          <tr>
            <th class="rt-c-old">文件名（双击修改）</th>
            <th class="rt-c-title">大小</th>
            <th class="rt-c-status">状态</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="list-empty" class="empty">
        <div class="empty-icon">🏷️</div>
        <p>选择一个文件夹后，这里会列出里面的视频；双击文件名即可改名</p>
      </div>
    </div>
  </section>

  <!-- ================= 右：说明与执行 ================= -->
  <aside class="panel panel-right">
    <div class="panel-head">
      <h2>改名</h2>
    </div>

    <div class="group">
      <div class="group-title">怎么改</div>
      <p class="tip">
        双击文件名 → 直接输入新名字 → 回车确认（Esc 取消）。<br>
        改完点下面的「确认改名」才会真正落盘；在此之前只是预览。
      </p>
    </div>

    <div class="group">
      <div class="group-title">本次</div>
      <ul class="stat-list" id="stats">
        <li><span>视频</span><b id="st-total">0</b></li>
        <li><span>已修改</span><b id="st-edited">0</b></li>
      </ul>
      <p class="tip">只改名字、不能改扩展名；目标重名会跳过，绝不覆盖。</p>
    </div>

    <div class="spacer"></div>

    <div id="result-box" class="result-box hidden"></div>
    <button id="btn-apply" class="btn btn-start" disabled>确认改名</button>
  </aside>

</main>

<div id="toast" class="toast"></div>
<script src="/static/rename.js"></script>
</body>
</html>
