<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComicPack · 播放</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶️</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/play.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">▶️</span>
    <div class="brand-text">
      <h1>ComicPack <span class="tag">播放</span></h1>
      <p>倍速 · 音量 · 拖动进度</p>
    </div>
  </div>
  <nav class="nav">
    <a class="ghost" href="/">打包</a>
    <a class="ghost" href="/reader">阅读</a>
    <a class="ghost" href="/rename">改名</a>
    <a class="ghost" href="/organize">整理</a>
    <a class="ghost" href="/emby">剧集</a>
    <a class="ghost" href="/play" aria-current="page">播放</a>
  </nav>
  <button id="btn-quit" class="ghost" title="停止本地服务">关闭服务</button>
</header>

<main class="play-layout">

  <!-- 左：播放列表 -->
  <aside class="panel play-side">
    <div class="panel-head">
      <h2>视频</h2>
      <span class="hint" id="list-hint">选择文件夹</span>
    </div>

    <div class="path-row">
      <input id="path" type="text" spellcheck="false"
             placeholder="粘贴文件夹路径，或选一个视频文件">
      <button id="btn-browse" class="btn btn-primary">浏览…</button>
      <button id="btn-scan" class="btn">扫描</button>
    </div>

    <div id="summary" class="summary">尚未选择文件夹</div>
    <ul id="playlist" class="playlist"></ul>
    <p class="tip">递归扫描子文件夹（Emby 的 <code>剧名/Season 01/</code> 也能读）；支持拖动进度、倍速、音量、滚轮切换。</p>
  </aside>

  <!-- 右：播放器 -->
  <section class="panel play-stage">
    <div class="play-video-wrap">
      <video id="video" playsinline preload="metadata"></video>
      <div id="empty" class="play-empty">
        <div class="empty-icon">▶️</div>
        <p>从左边选一个视频开始播放</p>
      </div>
      <div id="error" class="play-error hidden"></div>
    </div>

    <div class="play-controls">
      <button id="btn-play" class="play-btn" title="播放 / 暂停（空格）">▶</button>
      <span id="time" class="play-time">00:00 / 00:00</span>
      <input id="seek" class="play-seek" type="range" min="0" max="1000" step="1" value="0"
             aria-label="进度">
      <label class="play-speed">
        <span>倍速</span>
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
        </select>
      </label>
      <button id="btn-mute" class="play-btn" title="静音（M）">🔊</button>
      <input id="volume" class="play-volume" type="range" min="0" max="100" step="1" value="100"
             aria-label="音量">
      <span id="vol-label" class="play-vol-label">100%</span>
      <button id="btn-full" class="play-btn" title="全屏（F）">⛶</button>
    </div>

    <div class="play-info">
      <span id="info-title" class="play-title">未选择视频</span>
      <span id="info-res" class="play-badge"></span>
      <span id="info-size" class="play-dim"></span>
      <span class="play-keys">空格 播放 · ←→ 快进退 · ↑↓ 音量 · 滚轮 切换视频 · F 全屏 · M 静音</span>
    </div>
  </section>

</main>

<div id="toast" class="toast"></div>
<script src="/static/play.js"></script>
</body>
</html>
